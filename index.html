<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ghostwriter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <header class="hud">
      <div class="title-row">
        <h1>Ghostwriter</h1>
        <div class="title-buttons">
          <button id="btn-mute" class="icon" aria-label="Toggle sound"></button>
          <button id="btn-help" class="icon" aria-label="How to play">?</button>
        </div>
      </div>
      <div class="stats">
        <div class="stat"><span class="label">Round</span><span id="round"></span></div>
        <div class="stat"><span class="label">Words</span><span id="words"></span></div>
        <div class="stat"><span class="label">Swaps</span><span id="swaps"></span></div>
        <div class="stat money"><span class="label">Money</span><span id="money"></span></div>
      </div>
      <div class="progress">
        <div class="bar"><div id="bar-fill"></div></div>
        <div class="progress-text"><span id="score"></span> / <span id="target"></span></div>
      </div>
    </header>

    <div id="curse" class="curse" hidden></div>

    <section class="charms-wrap" aria-label="Charms">
      <div class="charms-head">
        <h2>Charms</h2>
        <span class="hint">Trigger left to right. Tap a charm to move or sell it.</span>
      </div>
      <div id="charms" class="charms"></div>
    </section>

    <section class="board" id="board">
      <div id="word" class="word" aria-live="polite"></div>
      <div class="scoreboard">
        <div id="word-label" class="word-label"></div>
        <div class="calc">
          <div class="box chips"><span class="label">Chips</span><span id="chips">0</span></div>
          <span class="times">×</span>
          <div class="box mult"><span class="label">Mult</span><span id="mult">0</span></div>
          <span id="equals" class="equals"></span>
        </div>
      </div>
      <div id="rack" class="rack"></div>
      <div class="actions">
        <button id="btn-play" class="primary">Play <kbd>Enter</kbd></button>
        <button id="btn-swap" title="Trade the selected tiles for new ones">Swap selected</button>
        <button id="btn-shuffle">Shuffle <kbd>Space</kbd></button>
        <button id="btn-clear">Clear <kbd>Esc</kbd></button>
      </div>
    </section>

    <section class="log">
      <h2>This round</h2>
      <ol id="played"></ol>
    </section>

    <footer>
      <span id="seed"></span>
      <span id="bag"></span>
    </footer>
  </main>

  <div id="overlay" class="overlay" hidden>
    <div id="modal" class="modal" role="dialog" aria-modal="true"></div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <div id="fx" class="fx" aria-hidden="true"></div>

  <script src="src/words.js"></script>
  <script src="src/logic.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/ui.js"></script>
</body>
</html>
